<!-- 在 <head> 中加入 Google 與 LINE LIFF 的 SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<!-- 引入 JWT 解析庫 (用於解析 Google 回傳的 Token) -->
<script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>

<!-- ... (中間的 CSS 樣式與遊戲 UI 保持不變) ... -->

<!-- 將原本的登入區塊 (#loginBox) 替換為以下內容 -->
<div id="loginBox">
  <div style="margin-bottom: 15px; color: #aaa; font-size: 0.9rem;">選擇登入方式：</div>
  
  <!-- Google 登入按鈕容器 -->
  <div id="googleLoginBtn" style="display: flex; justify-content: center; margin-bottom: 15px;"></div>
  
  <!-- LINE 登入按鈕 -->
  <button type="button" data-action="line-login" class="btn-auth" style="background: #06C755; color: white;">
    使用 LINE 登入
  </button>
</div>
