<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <h1>🏴‍☠️ 海盜 3×3 陣地決鬥 (V2測試版)</h1>
  <style>
    :root {
      --bg-color: #1a0f08;
      --card-bg: #2c1d11;
      --border-color: #8c6747;
      --gold: #f39c12;
      --player-color: #e74c3c;
      --enemy-color: #2980b9;
      --text-color: #f5e6ca;

      --rarity-S: #ffd700;
      --rarity-A: #a335ee;
      --rarity-B: #0070dd;
      --rarity-C: #9d9d9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    h1 {
      color: var(--gold);
      margin-bottom: 10px;
      font-size: 1.6rem;
      text-shadow: 2px 2px 4px #000;
    }

    .auth-container {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.8);
      margin-top: 20px;
      text-align: center;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      font-weight: bold;
      color: #aaa;
      transition: all 0.2s;
    }

    .auth-tab.active {
      color: var(--gold);
      border-bottom: 3px solid var(--gold);
      background: rgba(243, 156, 18, 0.1);
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 5px;
      color: var(--text-color);
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      background: #110a05;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-group input:focus { border-color: var(--gold); }

    .btn-auth {
      width: 100%;
      padding: 12px;
      background: var(--gold);
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-auth:active { background: #e08e0b; }

    .btn-guest {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #aaa;
      margin-top: 10px;
    }

    .btn-clear {
      background: transparent;
      border: none;
      color: #777;
      font-size: 0.75rem;
      margin-top: 15px;
      text-decoration: underline;
      cursor: pointer;
    }

    .auth-error {
      color: #ff4757;
      font-size: 0.85rem;
      margin-bottom: 10px;
      min-height: 20px;
      font-weight: bold;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      background: #110a05;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .btn-logout {
      background: #333;
      color: #ccc;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .status-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 380px;
      margin-bottom: 15px;
      background: var(--card-bg);
      padding: 10px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
    }

    .cap-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 45%;
    }

    .hp-bar-bg {
      width: 100%;
      height: 14px;
      background: #444;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 5px;
      border: 1px solid #000;
    }

    .hp-bar {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .player-hp { background: var(--player-color); }
    .enemy-hp { background: var(--enemy-color); }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      background: #0f0804;
      padding: 8px;
      border: 3px solid var(--border-color);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
    }

    .cell {
      background: var(--card-bg);
      border: 2px dashed #5c4028;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }

    .cell.owned-player { background: #4a1c1c; }
    .cell.owned-enemy { background: #1c324a; }

    .cell-icon { font-size: 2rem; }
    .cell-power {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--gold);
      position: absolute;
      bottom: 4px;
      right: 6px;
    }

    .cell-rarity {
      font-size: 0.7rem;
      font-weight: bold;
      position: absolute;
      top: 4px;
      left: 6px;
    }

    .hand-title { margin: 15px 0 5px 0; font-size: 0.9rem; color: #aaa; }
    .hand {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 380px;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 4px;
      width: 30%;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .rarity-S { border-color: var(--rarity-S) !important; box-shadow: 0 0 8px rgba(255, 215, 0, 0.6); }
    .rarity-A { border-color: var(--rarity-A) !important; box-shadow: 0 0 5px rgba(163, 53, 238, 0.4); }
    .rarity-B { border-color: var(--rarity-B) !important; }
    .rarity-C { border-color: var(--rarity-C) !important; }

    .card-badge {
      position: absolute;
      top: 4px;
      left: 4px;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 3px;
      background: rgba(0,0,0,0.7);
    }

    .badge-S { color: var(--rarity-S); border: 1px solid var(--rarity-S); }
    .badge-A { color: var(--rarity-A); border: 1px solid var(--rarity-A); }
    .badge-B { color: var(--rarity-B); border: 1px solid var(--rarity-B); }
    .badge-C { color: var(--rarity-C); border: 1px solid var(--rarity-C); }

    .card.selected { transform: translateY(-8px); box-shadow: 0 0 12px var(--gold); border-color: var(--gold) !important; }
    
    .card-icon { font-size: 1.8rem; margin-top: 6px; }
    .card-name { font-size: 0.8rem; margin: 4px 0; font-weight: bold; }
    .card-desc { font-size: 0.65rem; color: #ccc; text-align: center; }

    .log {
      margin-top: 15px;
      font-size: 0.85rem;
      color: var(--gold);
      height: 24px;
      text-align: center;
    }

    .btn-reset {
      margin-top: 10px;
      padding: 8px 16px;
      background: var(--gold);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <h1>🏴‍☠️ 海盜 3×3 陣地決鬥</h1>

  <!-- 登入 / 註冊 介面 -->
  <div id="authScreen" class="auth-container">
    <div class="auth-tabs">
      <div id="tabLogin" class="auth-tab active" onclick="switchTab('login')">玩家登入</div>
      <div id="tabRegister" class="auth-tab" onclick="switchTab('register')">註冊帳號</div>
    </div>

    <div class="auth-error" id="authError"></div>

    <!-- 登入區塊 -->
    <div id="loginBox">
      <div class="form-group">
        <label>船長暱稱 / 帳號</label>
        <input type="text" id="loginUser" placeholder="請輸入暱稱">
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="loginPass" placeholder="請輸入密碼">
      </div>
      <button type="button" class="btn-auth" onclick="handleLogin()">進入航程 (登入)</button>
    </div>

    <!-- 註冊區塊 -->
    <div id="registerBox" class="hidden">
      <div class="form-group">
        <label>設定船長暱稱</label>
        <input type="text" id="regUser" placeholder="請輸入暱稱">
      </div>
      <div class="form-group">
        <label>設定密碼</label>
        <input type="password" id="regPass" placeholder="設定密碼">
      </div>
      <div class="form-group">
        <label>確認密碼</label>
        <input type="password" id="regPassConfirm" placeholder="再次輸入密碼">
      </div>
      <button type="button" class="btn-auth" onclick="handleRegister()">創建海盜團 (註冊)</button>
    </div>

    <button type="button" class="btn-auth btn-guest" onclick="startGuestGame()">訪客試玩</button>
    <br>
    <button type="button" class="btn-clear" onclick="clearLocalData()">重置本地快取</button>
  </div>

  <!-- 遊戲主畫面 -->
  <div id="gameScreen" class="hidden">
    <div class="user-bar">
      <span>⚓ 船長：<strong id="displayUsername" style="color:var(--gold)">訪客</strong></span>
      <button type="button" class="btn-logout" onclick="handleLogout()">登出</button>
    </div>

    <div class="status-container">
      <div class="cap-box">
        <span id="playerCapTitle">紅鬍子船長</span>
        <div class="hp-bar-bg"><div id="playerHpBar" class="hp-bar player-hp"></div></div>
        <span id="playerHpText" style="font-size: 0.8rem; margin-top:2px;">30 / 30</span>
      </div>
      <div style="align-self: center; font-weight: bold; color: var(--gold);">VS</div>
      <div class="cap-box">
        <span>黑鬍子船長 (敵方)</span>
        <div class="hp-bar-bg"><div id="enemyHpBar" class="hp-bar enemy-hp"></div></div>
        <span id="enemyHpText" style="font-size: 0.8rem; margin-top:2px;">30 / 30</span>
      </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="hand-title">點擊手牌進行選擇 (抽卡包含 S/A/B/C 級)：</div>
    <div class="hand" id="hand"></div>

    <div class="log" id="log">輪到你的回合，請選擇手牌並點擊陣地！</div>
    <button type="button" class="btn-reset" id="resetBtn" onclick="initGame()">重新開局</button>
  </div>

  <script>
    // 錯誤捕獲顯示於畫面
    window.onerror = function(msg, url, line) {
      const errEl = document.getElementById('authError');
      if (errEl) errEl.innerText = "腳本執行錯誤: " + msg + " (Line " + line + ")";
      return false;
    };

    // 記憶體備用儲存（防止 localStorage 遭到 Safari/無痕模式禁用）
    const memoryStorage = {};
    function safeGet(key) {
      try { return localStorage.getItem(key); }
      catch (e) { return memoryStorage[key] || null; }
    }
    function safeSet(key, value) {
      try { localStorage.setItem(key, value); }
      catch (e) { memoryStorage[key] = value; }
    }
    function safeRemove(key) {
      try { localStorage.removeItem(key); }
      catch (e) { delete memoryStorage[key]; }
    }

    let currentUser = null;

    function getUsers() {
      try { return JSON.parse(safeGet('pirate_users') || '{}'); }
      catch(e) { return {}; }
    }

    // --- 全域按鈕觸發函數 (保證 100% 可被 HTML 點擊) ---
    function switchTab(type) {
      document.getElementById('authError').innerText = '';
      if (type === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('registerBox').classList.add('hidden');
      } else {
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('registerBox').classList.remove('hidden');
        document.getElementById('loginBox').classList.add('hidden');
      }
    }

    function handleRegister() {
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value;
      const passConfirm = document.getElementById('regPassConfirm').value;
      const errorEl = document.getElementById('authError');

      if (!user || !pass) {
        errorEl.innerText = '帳號與密碼不能留空！';
        return;
      }
      if (pass !== passConfirm) {
        errorEl.innerText = '兩次輸入的密碼不一致！';
        return;
      }

      const users = getUsers();
      if (users[user]) {
        errorEl.innerText = '此暱稱已有人使用！';
        return;
      }

      users[user] = { password: pass };
      safeSet('pirate_users', JSON.stringify(users));
      alert('註冊成功！已自動為您登入。');
      loginSuccess(user);
    }

    function handleLogin() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value;
      const errorEl = document.getElementById('authError');

      const users = getUsers();
      if (!users[user] || users[user].password !== pass) {
        errorEl.innerText = '帳號或密碼錯誤！';
        return;
      }

      loginSuccess(user);
    }

    function startGuestGame() {
      loginSuccess('訪客船長');
    }

    function handleLogout() {
      currentUser = null;
      safeRemove('pirate_session');
      document.getElementById('gameScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    }

    function clearLocalData() {
      try { localStorage.clear(); } catch(e){}
      alert('本地快取已清空，網頁即將刷新！');
      location.reload();
    }

    function loginSuccess(username) {
      currentUser = username;
      safeSet('pirate_session', username);
      
      document.getElementById('displayUsername').innerText = username;
      document.getElementById('playerCapTitle').innerText = username;
      
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      initGame();
    }

    // --- 遊戲邏輯 ---
    const CARD_POOLS = {
      S: [
        { name: '海賊王', icon: '🏴‍☠️', power: 9, desc: '戰力9 (直傷4/恢復4)', directDmg: 4, heal: 4, rarity: 'S' },
        { name: '深海巨獸', icon: '🦑', power: 10, desc: '戰力10 (自傷3點HP)', recoil: 3, rarity: 'S' }
      ],
      A: [
        { name: '皇家巨砲', icon: '💥', power: 7, desc: '戰力7 (直傷3點)', directDmg: 3, rarity: 'A' },
        { name: '狂暴船長', icon: '🧔‍♂️', power: 6, desc: '戰力6 (恢復3點HP)', heal: 3, rarity: 'A' }
      ],
      B: [
        { name: '燧發槍手', icon: '🗡️', power: 5, desc: '戰力5', rarity: 'B' },
        { name: '炸藥桶', icon: '💣', power: 6, desc: '戰力6 (自傷2點HP)', recoil: 2, rarity: 'B' },
        { name: '朗姆酒', icon: '🍺', power: 3, desc: '戰力3 (恢復4點HP)', heal: 4, rarity: 'B' }
      ],
      C: [
        { name: '水手', icon: '⚔️', power: 3, desc: '戰力3', rarity: 'C' },
        { name: '甲板雜役', icon: '🧹', power: 2, desc: '戰力2', rarity: 'C' },
        { name: '傳話鸚鵡', icon: '🦜', power: 1, desc: '戰力1 (直傷1點)', directDmg: 1, rarity: 'C' }
      ]
    };

    const WIN_LINES = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    let playerHp = 30, enemyHp = 30;
    let gridState = Array(9).fill(null);
    let playerHand = [];
    let selectedHandIndex = null;
    let isPlayerTurn = true;
    let gameOver = false;

    function initGame() {
      playerHp = 30; enemyHp = 30;
      gridState = Array(9).fill(null);
      selectedHandIndex = null;
      isPlayerTurn = true;
      gameOver = false;
      document.getElementById('resetBtn').style.display = 'none';
      
      playerHand = [];
      for (let i = 0; i < 3; i++) playerHand.push(drawCard());

      updateUI();
      log("遊戲開始！請選擇手牌並點擊陣地。");
    }

    function drawCard() {
      const rand = Math.random();
      let rarity = 'C';
      if (rand < 0.08) rarity = 'S';
      else if (rand < 0.28) rarity = 'A';
      else if (rand < 0.60) rarity = 'B';
      else rarity = 'C';

      const pool = CARD_POOLS[rarity];
      return { ...pool[Math.floor(Math.random() * pool.length)] };
    }

    function updateUI() {
      const pPercent = Math.max(0, (playerHp / 30) * 100);
      const ePercent = Math.max(0, (enemyHp / 30) * 100);
      document.getElementById('playerHpBar').style.width = pPercent + '%';
      document.getElementById('enemyHpBar').style.width = ePercent + '%';
      document.getElementById('playerHpText').innerText = `${Math.max(0, playerHp)} / 30`;
      document.getElementById('enemyHpText').innerText = `${Math.max(0, enemyHp)} / 30`;

      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      gridState.forEach((cell, idx) => {
        const div = document.createElement('div');
        div.className = 'cell';
        if (cell) {
          div.classList.add(cell.owner === 'player' ? 'owned-player' : 'owned-enemy');
          div.classList.add(`rarity-${cell.card.rarity}`);
          div.innerHTML = `
            <span class="cell-rarity badge-${cell.card.rarity}">${cell.card.rarity}</span>
            <span class="cell-icon">${cell.card.icon}</span>
            <span class="cell-power">${cell.card.power}</span>
          `;
        }
        div.onclick = function() { onCellClick(idx); };
        gridEl.appendChild(div);
      });

      const handEl = document.getElementById('hand');
      handEl.innerHTML = '';
      playerHand.forEach((card, idx) => {
        const div = document.createElement('div');
        div.className = `card rarity-${card.rarity} ${selectedHandIndex === idx ? 'selected' : ''}`;
        div.innerHTML = `
          <span class="card-badge badge-${card.rarity}">${card.rarity}卡</span>
          <span class="card-icon">${card.icon}</span>
          <span class="card-name">${card.name}</span>
          <span class="card-desc">${card.desc}</span>
        `;
        div.onclick = function() {
          if (!isPlayerTurn || gameOver) return;
          selectedHandIndex = idx;
          updateUI();
        };
        handEl.appendChild(div);
      });
    }

    function onCellClick(index) {
      if (!isPlayerTurn || gameOver || selectedHandIndex === null) return;

      const card = playerHand[selectedHandIndex];
      const targetCell = gridState[index];

      if (targetCell) {
        if (targetCell.owner === 'player') {
          log("不能覆蓋自己的卡牌！");
          return;
        }
        if (card.power <= targetCell.card.power) {
          log(`戰力不足！需要高於 ${targetCell.card.power} 才能搶奪敵方陣地。`);
          return;
        }
      }

      playCard('player', index, card);
      
      const newCard = drawCard();
      playerHand[selectedHandIndex] = newCard;
      selectedHandIndex = null;

      if (newCard.rarity === 'S') {
        log(`✨ 運氣爆棚！你抽到了【S級卡牌】${newCard.name}！`);
      }

      if (!checkWinConditions()) {
        isPlayerTurn = false;
        updateUI();
        setTimeout(enemyTurn, 1000);
      }
    }

    function playCard(owner, index, card) {
      gridState[index] = { owner, card };

      if (owner === 'player') {
        if (card.heal) playerHp = Math.min(30, playerHp + card.heal);
        if (card.recoil) playerHp -= card.recoil;
        if (card.directDmg) enemyHp -= card.directDmg;
      } else {
        if (card.heal) enemyHp = Math.min(30, enemyHp + card.heal);
        if (card.recoil) enemyHp -= card.recoil;
        if (card.directDmg) playerHp -= card.directDmg;
      }

      log(`${owner === 'player' ? '你' : '敵方'}使用了【${card.rarity}級-${card.name}】佔領陣地！`);

      checkLines(owner);
      updateUI();
    }

    function checkLines(owner) {
      WIN_LINES.forEach(line => {
        const [a, b, c] = line;
        if (gridState[a] && gridState[a].owner === owner &&
            gridState[b] && gridState[b].owner === owner &&
            gridState[c] && gridState[c].owner === owner) {
          
          const dmg = 12;
          if (owner === 'player') {
